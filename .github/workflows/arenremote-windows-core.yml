name: Build ArenRemote Windows x64 Core

on:
  workflow_dispatch:
  push:
    branches:
      - arenremote-v1
    paths:
      - "src/bin/arenremote.rs"
      - "src/bin/arenremote-viewer-launcher.rs"
      - "src/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "res/**"
      - ".github/workflows/arenremote-windows-core.yml"

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_DEFAULT_TRIPLET: "x64-windows-static"
  VCPKG_DEFAULT_HOST_TRIPLET: "x64-windows-static"
  CARGO_TERM_COLOR: always
  SCITER_SHA256: "4d97528e157c55ef1fabe9e37a9697116ab66660d7da6163f90a3a7abf80dd56"

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout ArenRemote source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install LLVM 15
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "15.0.6"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.75.0"
          targets: "x86_64-pc-windows-msvc"
          components: "rustfmt"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet x64-windows-static `
            --x-install-root="$env:VCPKG_ROOT\installed"

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: arenremote-windows-x64

      - name: Show tool versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          clang --version
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"

      - name: Generate Sciter inline resources
        shell: pwsh
        run: |
          python --version
          python res/inline-sciter.py
          if (-not (Test-Path 'src\ui\inline.rs')) {
            throw 'src/ui/inline.rs was not generated'
          }
          Get-Item 'src\ui\inline.rs' | Format-List FullName,Length,LastWriteTime

      - name: Compile ArenRemote core
        shell: pwsh
        run: |
          cargo build `
            --locked `
            --release `
            --target x86_64-pc-windows-msvc `
            --bin arenremote `
            --features inline

      - name: Compile technician viewer launcher
        shell: pwsh
        run: |
          cargo build `
            --locked `
            --release `
            --target x86_64-pc-windows-msvc `
            --bin arenremote-viewer-launcher

      - name: Download and verify Sciter Windows x64 runtime
        shell: pwsh
        run: |
          $SciterUrl = "https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll"
          $SciterPath = "target\x86_64-pc-windows-msvc\release\sciter.dll"
          Invoke-WebRequest -UseBasicParsing -Uri $SciterUrl -OutFile $SciterPath
          if (-not (Test-Path $SciterPath)) {
            throw "Sciter runtime was not downloaded: $SciterPath"
          }
          $ActualSciterHash = (Get-FileHash $SciterPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualSciterHash -ne $env:SCITER_SHA256) {
            throw "Sciter SHA256 mismatch. Expected $env:SCITER_SHA256, got $ActualSciterHash"
          }
          Write-Host "Verified Sciter SHA256: $ActualSciterHash"

      - name: Prepare artifact
        shell: pwsh
        run: |
          $CoreSource = "target\x86_64-pc-windows-msvc\release\arenremote.exe"
          $ViewerSource = "target\x86_64-pc-windows-msvc\release\arenremote-viewer-launcher.exe"
          $SciterSource = "target\x86_64-pc-windows-msvc\release\sciter.dll"
          if (-not (Test-Path $CoreSource)) { throw "ArenRemote binary was not produced: $CoreSource" }
          if (-not (Test-Path $ViewerSource)) { throw "Viewer launcher was not produced: $ViewerSource" }
          if (-not (Test-Path $SciterSource)) { throw "Sciter runtime was not produced: $SciterSource" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $CoreSource "dist\ArenRemote.Core.exe" -Force
          Copy-Item $ViewerSource "dist\ArenRemote.ViewerLauncher.exe" -Force
          Copy-Item $SciterSource "dist\sciter.dll" -Force

          $CoreHash = (Get-FileHash "dist\ArenRemote.Core.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $ViewerHash = (Get-FileHash "dist\ArenRemote.ViewerLauncher.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $SciterHash = (Get-FileHash "dist\sciter.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$CoreHash  ArenRemote.Core.exe" | Set-Content -Encoding ascii "dist\ArenRemote.Core.exe.sha256"
          "$ViewerHash  ArenRemote.ViewerLauncher.exe" | Set-Content -Encoding ascii "dist\ArenRemote.ViewerLauncher.exe.sha256"
          "$SciterHash  sciter.dll" | Set-Content -Encoding ascii "dist\sciter.dll.sha256"

          @(
            "Aren Remote Windows x64 support runtime",
            "Branch: $env:GITHUB_REF_NAME",
            "Commit: $env:GITHUB_SHA",
            "Target: Windows x64",
            "Runtime identity: ArenRemote",
            "Customer mode: headless; ArenCRM is the customer-facing UI",
            "Technician mode: per-user arenremote:// protocol launcher",
            "Viewer install directory: %LOCALAPPDATA%\ArenRemoteViewer",
            "Incoming control: requires local customer approval",
            "Remote desktop control only; file transfer/terminal/camera/tunnel disabled",
            "Rendezvous/relay: Aren self-hosted infrastructure",
            "No separate RustDesk UI is presented to the customer"
          ) | Set-Content -Encoding utf8 "dist\BUILD_INFO.txt"

          @(
            "OPEN-SOURCE NOTICES",
            "",
            "Aren Remote contains modified RustDesk open-source software as its remote-control engine.",
            "RustDesk upstream: https://github.com/rustdesk/rustdesk",
            "Modified Aren Remote source: https://github.com/usefiniausef-aren/arenremote-core",
            "RustDesk is licensed under GNU AGPL-3.0. Applicable source and license obligations are retained.",
            "",
            "The Sciter runtime is distributed as a separate runtime component beside ArenRemote.Core.exe."
          ) | Set-Content -Encoding utf8 "dist\OSS_NOTICES.txt"

          Get-ChildItem dist | Format-Table Name,Length,LastWriteTime

      - name: Upload ArenRemote Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: ArenRemote-Windows-x64-R5
          path: dist/*
          if-no-files-found: error
          retention-days: 14
